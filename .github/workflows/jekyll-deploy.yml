name: Build and deploy Jekyll site to GitHub Pages

# Triggers the workflow on push to 'main' branch.
# Adapt 'branches' to match your default branch name if needed.
on:
  push:
    branches: [main]

# Sets the maximum number of concurrent deployments to 1.
concurrency:
  group: jekyll-deploy
  cancel-in-progress: false

# Required permissions for actions/configure-pages and actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deploy a Jekyll site to GitHub Pages
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages (beta)
        id: deployment
        uses: actions/deploy-pages@v4
